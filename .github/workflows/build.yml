name: APK creator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Debug APK creator
        run: gradle assembleDebug --no-daemon

      - name: APK downlaod
        uses: actions/upload-artifact@v4
        with:
          name: music-cut-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.1.0 || gh release create v1.1.0 --target "$GITHUB_SHA" --title "Music Cut 1.1.0" --notes "Dark theme, precise trimming, audio quality settings, and sharing. English interface. Debug APK."
          gh release upload v1.1.0 app/build/outputs/apk/debug/app-debug.apk --clobber
